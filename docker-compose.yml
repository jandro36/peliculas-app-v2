services:
  web:
    build: .
    volumes:
      - /data/webapp:/var/www/html
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 3

  nginx-lb:
    image: nginx:latest
    container_name: nginx-load-balancer
    ports:
      - "3000:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:z
    depends_on:
      - web
    restart: unless-stopped
