user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Nginx agrupa tus 3 contenedores
    upstream app_peliculas {
        least_conn;
        server web:80 max_fails=2 fail_timeout=10s;
    }

    # Bloque único SSL
    server {
        listen 443 ssl;
        server_name _; 

        ssl_certificate /etc/nginx/certs/global.crt;
        ssl_certificate_key /etc/nginx/certs/global.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Cabeceras de seguridad
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Bloquear ficheros de datos sensibles y sesiones
        location ~* \.(json|txt|log|sqlite|md)$ {
            deny all;
            return 404;
        }

        location ^~ /sessions/ {
            deny all;
            return 404;
        }

        # Tráfico limpio a los contenedores Apache
        location / {
            proxy_pass http://app_peliculas;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
        }
    }
}
